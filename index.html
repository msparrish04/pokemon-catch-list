<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéTracker</title>
    <header>
    <h1 id="game-title">Pokémon Tracker</h1>
    <div id="progress-container">
        <div id="progress-bar-fill"></div>
        <span id="progress-text">0 / 0 caught</span>
    </div>
    </header>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1 id="game-title">Pokémon Tracker</h1>
    </header>

    <main id="pokedex-grid"></main>

    <div id="detail-modal" class="hidden">
        <div class="modal-content">
            <span id="modal-close">&times;</span>
            <img id="modal-img" src="" alt="">
            <h2 id="modal-name"></h2>
            <span id="modal-id"></span>

            <div class="modal-toggles">
                <label>
                    <input type="checkbox" id="modal-caught"> Caught
                </label>
                <label>
                    <input type="checkbox" id="modal-shiny"> ⭐ Shiny
                </label>
            </div>

            <div class="modal-gender">
                <label><input type="radio" name="gender" value="male"> ♂ Male</label>
                <label><input type="radio" name="gender" value="female"> ♀ Female</label>
                <label><input type="radio" name="gender" value="unknown"> Unknown</label>
            </div>

            <textarea id="modal-notes" placeholder="Notes..."></textarea>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
